display_information:
  name: Hermes Meeting Bot
  description: Markdown会議ログを検索して根拠付きで回答します
  background_color: "#1F2937"
features:
  bot_user:
    display_name: Hermes Meeting Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
